<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1080px;height:1920px}
  .box{position:absolute;left:120px;width:730px;top:230px;height:1210px;display:flex;flex-direction:column;justify-content:center;
       font:500 62px/1.32 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-0.3px}
  p{margin:0}
  p+p{margin-top:40px}
</style></head>
<body><div class="box"></div>
<script>
  const c = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.body.style.background = c.background || "#fff";
  document.body.style.color = c.color || "#111";
  const box = document.querySelector(".box");
  c.lines.forEach((line, i) => {
    const p = document.createElement("p");
    p.textContent = line;
    if (i >= c.show) p.style.visibility = "hidden";
    box.append(p);
  });
</script>
</body></html>
